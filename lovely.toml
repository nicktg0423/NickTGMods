# BossRush lovely patches
#
# The only two slot-identity checks that can't be fixed by hooking a global
# function live INSIDE end_round's defeat handler (state_events.lua:258) and
# new_round's state marker (state_events.lua:319). Both compare the blind
# OBJECT to bl_small/bl_big, so a boss in the Small slot falls into the
# Boss branch: wrong blind_states, shop voucher rerolled every blind,
# played_this_ante wiped mid-ante.
#
# The comparison lines are textually identical at both sites, and pattern
# patches apply to every match in the target file, so two rules cover all
# four lines. Payloads are gated on G.GAME.modifiers.bossrush: with the
# flag off, the conditions reduce to vanilla exactly.
#
# Verify after first launch: with dump_lua on, check
# Mods/lovely/dump/functions/state_events.lua and confirm BOTH the ~:258
# and ~:319 regions carry the patched conditions.

[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.round_resets.blind == G.P_BLINDS.bl_small then"
position = "at"
match_indent = true
payload = "if (G.GAME.modifiers.bossrush and G.GAME.blind_on_deck == 'Small') or (not G.GAME.modifiers.bossrush and G.GAME.round_resets.blind == G.P_BLINDS.bl_small) then"

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "elseif G.GAME.round_resets.blind == G.P_BLINDS.bl_big then"
position = "at"
match_indent = true
payload = "elseif (G.GAME.modifiers.bossrush and G.GAME.blind_on_deck == 'Big') or (not G.GAME.modifiers.bossrush and G.GAME.round_resets.blind == G.P_BLINDS.bl_big) then"
